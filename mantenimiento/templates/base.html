{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Equipos Registrados</h1>
        <a href="{{ url_for('new_equipment') }}" class="btn btn-primary">Nuevo Equipo</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Equipo</th>
                    <th>Ubicación</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for equipo in equipos %}
                <tr>
                    <td>{{ equipo.nombre }}</td>
                    <td>{{ equipo.ubicacion }}</td>
                    <td>
                        <a href="{{ url_for('view_equipment', id=equipo.id) }}" class="btn btn-sm btn-info">Ver</a>
                        <a href="{{ url_for('edit_equipment', id=equipo.id) }}" class="btn btn-sm btn-warning">Editar</a>
                        <a href="{{ url_for('eliminar_equipo', id=equipo.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Seguro que quieres eliminar este equipo?');">Eliminar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
